# Local development database. The credentials below are for local use only.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mymera
      POSTGRES_PASSWORD: mymera
      POSTGRES_DB: mymera
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymera -d mymera"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
